<svg width="100%" viewBox="0 0 680 484" role="img">
<title>CI pipeline steps</title>
<desc>A commit is pushed, dependencies are installed and built, tests run, then the change deploys to staging if tests pass or the author is notified if they fail.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray">
  <rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Push commit</text>
  <text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Developer pushes to main</text>
</g>
<line x1="340" y1="96" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
  <rect x="230" y="156" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Install and build</text>
  <text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">Uses cached dependencies</text>
</g>
<line x1="340" y1="212" x2="340" y2="262" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray">
  <rect x="230" y="272" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">Run tests</text>
  <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Unit and integration</text>
</g>
<path d="M340 328 L340 354 L200 354 L200 378" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M340 354 L480 354 L480 378" class="arr" fill="none" marker-end="url(#arrow)"/>
<g class="node c-green">
  <rect x="100" y="388" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="200" y="406" text-anchor="middle" dominant-baseline="central">Deploy to staging</text>
  <text class="ts" x="200" y="424" text-anchor="middle" dominant-baseline="central">Tests passed</text>
</g>
<g class="node c-red">
  <rect x="380" y="388" width="200" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="480" y="406" text-anchor="middle" dominant-baseline="central">Notify author</text>
  <text class="ts" x="480" y="424" text-anchor="middle" dominant-baseline="central">Tests failed</text>
</g>
</svg>
