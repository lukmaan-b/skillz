<style>
  @media (prefers-reduced-motion: no-preference) {
    @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .chip-new { animation: drop .4s ease-out; }
  }
  .fan { transition: opacity .3s; }
</style>
<h2 class="sr-only">Interactive hash map: each key is hashed to pick one of six buckets, and keys that land in the same bucket are chained together.</h2>
<svg width="100%" viewBox="0 0 680 420" role="img">
  <title>Hash map buckets</title>
  <desc>A key passes through a hash function shaped like a funnel and drops into one of six buckets.</desc>
  <g class="c-amber">
    <rect x="215" y="36" width="80" height="36" rx="6" stroke-width="0.5"/>
    <text id="key-text" class="th" x="255" y="54" text-anchor="middle" dominant-baseline="central">key</text>
  </g>
  <polygon class="shape" points="185,100 325,100 270,180 240,180"/>
  <g id="fans"></g>
  <g id="buckets"></g>
  <line class="leader" x1="299" y1="54" x2="484" y2="54"/>
  <text class="ts" x="490" y="54" dominant-baseline="central">Key</text>
  <line class="leader" x1="314" y1="118" x2="484" y2="140"/>
  <text class="ts" x="490" y="140" dominant-baseline="central">Hash function</text>
  <line class="leader" x1="472" y1="310" x2="484" y2="310"/>
  <text class="ts" x="490" y="310" dominant-baseline="central">Buckets</text>
</svg>
<p id="readout" style="font-size: 14px; color: var(--text-secondary); margin: 8px 0 12px;">Pick a key to store it.</p>
<div id="keys" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const BUCKETS = 6;
const keys = ['apple', 'kiwi', 'lime', 'plum', 'pear', 'mango', 'grape', 'fig'];
const stored = Array.from({ length: BUCKETS }, () => []);
const bx = (i) => 40 + 74 * i;
const el = (tag, attrs) => {
  const node = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
};
const hash = (key) => [...key].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);

const fans = document.getElementById('fans');
const buckets = document.getElementById('buckets');
for (let i = 0; i < BUCKETS; i++) {
  fans.appendChild(el('line', { id: `fan-${i}`, class: 'fan', x1: 255, y1: 180, x2: bx(i) + 30, y2: 250, stroke: 'var(--text-muted)', 'stroke-width': 1, opacity: 0.5 }));
  const g = el('g', { id: `bucket-${i}` });
  const shell = el('g', { class: 'c-gray' });
  shell.appendChild(el('rect', { x: bx(i), y: 260, width: 60, height: 100, rx: 4, 'stroke-width': 0.5 }));
  g.appendChild(shell);
  const label = el('text', { class: 'ts', x: bx(i) + 30, y: 378, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
  label.textContent = i;
  g.appendChild(label);
  buckets.appendChild(g);
}

function insert(key) {
  const h = hash(key);
  const i = h % BUCKETS;
  document.getElementById('key-text').textContent = key;
  for (let j = 0; j < BUCKETS; j++) {
    const line = document.getElementById(`fan-${j}`);
    const on = j === i;
    line.setAttribute('stroke', on ? 'var(--amber-400)' : 'var(--text-muted)');
    line.setAttribute('stroke-width', on ? 3 : 1);
    line.setAttribute('opacity', on ? 1 : 0.5);
  }
  const already = stored[i].includes(key);
  document.getElementById('readout').textContent = `hash("${key}") = ${h}, and ${h} % ${BUCKETS} = ${i}` +
    (already ? ' — already stored.' : stored[i].length ? ' — collision, chained in the same bucket.' : '.');
  if (already) return;
  document.querySelectorAll('.chip-latest').forEach((c) => c.setAttribute('class', 'c-gray'));
  const k = stored[i].length;
  stored[i].push(key);
  const y = 334 - 24 * k;
  const chip = el('g', { class: 'c-amber chip-latest chip-new' });
  chip.appendChild(el('rect', { x: bx(i) + 5, y, width: 50, height: 20, rx: 4, 'stroke-width': 0.5 }));
  const text = el('text', { class: 'ts', x: bx(i) + 30, y: y + 10, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
  text.textContent = key;
  chip.appendChild(text);
  document.getElementById(`bucket-${i}`).appendChild(chip);
}

const keyBar = document.getElementById('keys');
keys.forEach((key) => {
  const b = document.createElement('button');
  b.textContent = key;
  b.addEventListener('click', () => insert(key));
  keyBar.appendChild(b);
});
</script>
