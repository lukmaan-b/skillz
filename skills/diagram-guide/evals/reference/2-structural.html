<svg width="100%" viewBox="0 0 680 290" role="img">
<title>Web app architecture</title>
<desc>Users reach a load balancer inside a cloud VPC, which forwards to app servers, which talk to a Postgres database inside a private subnet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray">
  <rect x="100" y="40" width="540" height="210" rx="20" stroke-width="0.5"/>
  <text class="th" x="120" y="66">Cloud VPC</text>
</g>
<g class="c-purple">
  <rect x="120" y="154" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="184" y="172" text-anchor="middle" dominant-baseline="central">Load balancer</text>
  <text class="ts" x="184" y="190" text-anchor="middle" dominant-baseline="central">Spreads load</text>
</g>
<g class="c-purple">
  <rect x="288" y="154" width="128" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="352" y="172" text-anchor="middle" dominant-baseline="central">App servers</text>
  <text class="ts" x="352" y="190" text-anchor="middle" dominant-baseline="central">3 replicas</text>
</g>
<g class="c-teal">
  <rect x="456" y="90" width="164" height="140" rx="12" stroke-width="0.5"/>
  <text class="th" x="538" y="114" text-anchor="middle" dominant-baseline="central">Private subnet</text>
  <text class="ts" x="538" y="134" text-anchor="middle" dominant-baseline="central">No public access</text>
</g>
<g class="c-teal-2">
  <rect x="476" y="154" width="124" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="538" y="172" text-anchor="middle" dominant-baseline="central">Postgres</text>
  <text class="ts" x="538" y="190" text-anchor="middle" dominant-baseline="central">With replica</text>
</g>
<text class="ts" x="40" y="182" dominant-baseline="central">Users</text>
<line x1="78" y1="182" x2="110" y2="182" class="arr" marker-end="url(#arrow)"/>
<line x1="250" y1="182" x2="278" y2="182" class="arr" marker-end="url(#arrow)"/>
<line x1="418" y1="182" x2="466" y2="182" class="arr" marker-end="url(#arrow)"/>
</svg>
