<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  (function () {
    var asked = new URLSearchParams(location.search).get('mode');
    var mode = asked === 'dark' || asked === 'light' ? asked
      : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-mode', mode);
  })();
</script>
<style>
{{THEME}}
{{BASE}}
</style>
{{HEAD}}
</head>
<body>
<div class="mode-bar"><button type="button" id="mode-toggle"></button></div>
<main class="frame">
{{DIAGRAM}}
</main>
<script>
  (function () {
    var root = document.documentElement;
    var button = document.getElementById('mode-toggle');
    var label = function () { button.textContent = root.getAttribute('data-mode') === 'dark' ? 'Light mode' : 'Dark mode'; };
    label();
    button.addEventListener('click', function () {
      root.setAttribute('data-mode', root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
      label();
      document.dispatchEvent(new CustomEvent('modechange', { detail: root.getAttribute('data-mode') }));
    });
  })();
</script>
</body>
</html>
